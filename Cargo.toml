[package]
name = "aether-renderer-capture"
version = "0.1.0"
edition = "2024"
authors = ["Mads Paaskesen <madspaaskesen@gmail.com>"]
description = "Deterministic HTML -> transparent PNG sequence capture via chrome-headless-shell (BeginFrame + virtual time), the HTML finger of Aether Renderer"
license = "MIT"
repository = "https://github.com/madspaaskesen/aether-renderer-capture"
homepage = "https://github.com/madspaaskesen/aether-renderer-capture"
keywords = ["headless-chrome", "animation", "png", "capture", "aether"]
categories = ["multimedia::video", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chromiumoxide = "0.9.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
indicatif = "0.18.6"
libc = "0.2.191"
tokio = { version = "1.54.1", features = ["full"] }
